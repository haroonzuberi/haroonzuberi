<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Haroon Zuberi — AI Automation Expert and MVP / SaaS Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2CB4D"/>
      <stop offset="0.5" stop-color="#E4B429"/>
      <stop offset="1" stop-color="#C9992B"/>
    </linearGradient>
    <radialGradient id="globeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E4B429" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E4B429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeFill" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2a2410"/>
      <stop offset="1" stop-color="#141414"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#E4B429" fill-opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="340" rx="20"/></clipPath>
    <style>
      @keyframes fadeUp { 0% { opacity:0; transform: translateY(14px);} 100% { opacity:1; transform: translateY(0);} }
      @keyframes twinkle { 0%,100% { opacity:0.25;} 50% { opacity:1;} }
      .r1{opacity:0;animation:fadeUp .7s ease-out forwards .10s}
      .r2{opacity:0;animation:fadeUp .7s ease-out forwards .28s}
      .r3{opacity:0;animation:fadeUp .7s ease-out forwards .46s}
      .r4{opacity:0;animation:fadeUp .7s ease-out forwards .64s}
      .r5{opacity:0;animation:fadeUp .7s ease-out forwards .82s}
      .tw{animation:twinkle 3s ease-in-out infinite}
      .tw2{animation:twinkle 3s ease-in-out infinite .8s}
      .tw3{animation:twinkle 3s ease-in-out infinite 1.6s}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <circle filter="url(#soft)" cx="985" cy="170" r="150" fill="url(#globeGlow)"/>
    <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#2c2a22" stroke-width="1"/>

    <!-- ░░ LEFT: identity ░░ -->
    <g transform="translate(64,70)">
      <g class="r1">
        <rect x="0" y="0" width="232" height="30" rx="15" fill="#1c1a12" stroke="#E4B429" stroke-width="1.1" stroke-opacity="0.6"/>
        <circle cx="18" cy="15" r="4" fill="#E4B429"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
        <text x="32" y="20" fill="#EAE6D9" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">AI AUTOMATION · MVP ENGINEER</text>
      </g>

      <text class="r2" x="0" y="92" fill="url(#gold)" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">Haroon Zuberi</text>

      <text class="r3" x="2" y="132" fill="#EAE6D9" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="21" font-weight="500">I build <tspan fill="#F2CB4D" font-weight="700">AI automations</tspan> and ship <tspan fill="#F2CB4D" font-weight="700">SaaS MVPs</tspan>.</text>

      <g class="r4" transform="translate(0,150)" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="12.5" font-weight="600">
        <g>
          <rect x="0" y="0" width="120" height="26" rx="6" fill="#1c1a12" stroke="#2c2a22"/>
          <text x="60" y="17" fill="#E4B429" text-anchor="middle">AI Automation Expert</text>
        </g>
        <g transform="translate(132,0)">
          <rect x="0" y="0" width="128" height="26" rx="6" fill="#1c1a12" stroke="#2c2a22"/>
          <text x="64" y="17" fill="#E4B429" text-anchor="middle">MVP &amp; SaaS Engineer</text>
        </g>
      </g>

      <text class="r5" x="1" y="205" fill="#8F8A79" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13">n8n · LangChain · LangGraph · Claude · Next.js · FastAPI · Python</text>
    </g>

    <!-- ░░ RIGHT: rotating globe ░░ -->
    <g class="r4" transform="translate(985,170)">
      <circle cx="0" cy="0" r="100" fill="url(#globeFill)" stroke="#E4B429" stroke-width="1.2" stroke-opacity="0.35"/>

      <!-- latitude lines -->
      <g fill="none" stroke="#E4B429" stroke-opacity="0.28" stroke-width="1">
        <ellipse cx="0" cy="-60" rx="80" ry="18"/>
        <ellipse cx="0" cy="-30" rx="95" ry="23"/>
        <ellipse cx="0" cy="0"   rx="100" ry="26"/>
        <ellipse cx="0" cy="30"  rx="95" ry="23"/>
        <ellipse cx="0" cy="60"  rx="80" ry="18"/>
      </g>

      <!-- static meridians -->
      <g fill="none" stroke="#E4B429" stroke-opacity="0.22" stroke-width="1">
        <ellipse cx="0" cy="0" rx="100" ry="100"/>
        <ellipse cx="0" cy="0" rx="60" ry="100"/>
        <ellipse cx="0" cy="0" rx="26" ry="100"/>
      </g>
      <!-- animated sweeping meridian (rotation illusion) -->
      <ellipse cx="0" cy="0" ry="100" fill="none" stroke="#F2CB4D" stroke-opacity="0.75" stroke-width="1.4">
        <animate attributeName="rx" values="6;100;6" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.85;0.35;0.85" dur="7s" repeatCount="indefinite"/>
      </ellipse>

      <!-- surface nodes -->
      <g fill="#F2CB4D">
        <circle class="tw"  cx="-42" cy="-38" r="3"/>
        <circle class="tw2" cx="30"  cy="-52" r="2.6"/>
        <circle class="tw3" cx="55"  cy="18"  r="3"/>
        <circle class="tw2" cx="-20" cy="46"  r="2.6"/>
        <circle class="tw"  cx="12"  cy="8"   r="2.4"/>
      </g>

      <!-- orbiting satellites on a rotating ring -->
      <g fill="none" stroke="#E4B429" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 8">
        <circle cx="0" cy="0" r="122"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </g>
      <g>
        <g fill="#E4B429">
          <circle cx="122" cy="0" r="4"/>
          <circle cx="-61" cy="105" r="3"/>
          <circle cx="-61" cy="-105" r="3"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
