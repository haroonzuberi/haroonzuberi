<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195" fill="none" role="img" aria-label="Core stack">
  <defs>
    <linearGradient id="l_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <style>
      @keyframes grow { from { transform: scaleX(0);} to { transform: scaleX(1);} }
      .bar { transform-origin: left center; animation: grow 1s cubic-bezier(.3,1,.5,1) forwards; }
      .g2{animation-delay:.12s}.g3{animation-delay:.24s}.g4{animation-delay:.36s}.g5{animation-delay:.48s}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="194" rx="14" fill="url(#l_bg)" stroke="#30363d"/>
  <rect x="0" y="0" width="4" height="195" rx="2" fill="#58a6ff"/>
  <text x="22" y="32" fill="#58a6ff" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="16" font-weight="700">Core Stack</text>
  <line x1="22" y1="42" x2="278" y2="42" stroke="#30363d"/>

  <g font-family="'Segoe UI',Ubuntu,sans-serif" font-size="12.5">
    <text x="22" y="62" fill="#c9d1d9">TypeScript</text>
    <text x="278" y="62" fill="#8b949e" font-size="11" text-anchor="end">95%</text>
    <rect x="22" y="67" width="256" height="7" rx="3.5" fill="#21262d"/>
    <rect class="bar" x="22" y="67" width="243" height="7" rx="3.5" fill="#3fb950"/>

    <text x="22" y="88" fill="#c9d1d9">Next.js / React</text>
    <text x="278" y="88" fill="#8b949e" font-size="11" text-anchor="end">90%</text>
    <rect x="22" y="93" width="256" height="7" rx="3.5" fill="#21262d"/>
    <rect class="bar g2" x="22" y="93" width="230" height="7" rx="3.5" fill="#3fb950"/>

    <text x="22" y="114" fill="#c9d1d9">Python / FastAPI</text>
    <text x="278" y="114" fill="#8b949e" font-size="11" text-anchor="end">88%</text>
    <rect x="22" y="119" width="256" height="7" rx="3.5" fill="#21262d"/>
    <rect class="bar g3" x="22" y="119" width="225" height="7" rx="3.5" fill="#3fb950"/>

    <text x="22" y="140" fill="#c9d1d9">Node.js</text>
    <text x="278" y="140" fill="#8b949e" font-size="11" text-anchor="end">82%</text>
    <rect x="22" y="145" width="256" height="7" rx="3.5" fill="#21262d"/>
    <rect class="bar g4" x="22" y="145" width="210" height="7" rx="3.5" fill="#3fb950"/>

    <text x="22" y="166" fill="#c9d1d9">n8n · LangChain · AI</text>
    <text x="278" y="166" fill="#8b949e" font-size="11" text-anchor="end">92%</text>
    <rect x="22" y="171" width="256" height="7" rx="3.5" fill="#21262d"/>
    <rect class="bar g5" x="22" y="171" width="235" height="7" rx="3.5" fill="#3fb950"/>
  </g>
</svg>
